<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 780" width="1250" height="780" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cascade Dev Flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .band { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #6b7280; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .box-title { font-size: 15px; font-weight: 700; fill: #111827; }
      .box-text { font-size: 12.5px; fill: #374151; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12.5px; fill: #111827; }
      .edge { fill: none; stroke: #374151; stroke-width: 1.8; }
      .edge-dashed { fill: none; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .edge-red { fill: none; stroke: #b91c1c; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .edge-label { font-size: 11.5px; fill: #374151; }
      .edge-label-red { font-size: 11.5px; fill: #b91c1c; font-weight: 600; }
      .lead { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .exec { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .gate { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .review { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .human { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .t1 { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .t2 { fill: #e0e7ff; stroke: #4338ca; stroke-width: 2; }
      .t3 { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .plain { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1250" height="780"/>
  <text class="title" x="40" y="44">Cascade Dev Flow</text>
  <text class="subtitle" x="40" y="68">Cheap models work, deterministic checks judge first, a human approves every merge.</text>

  <!-- Main flow -->
  <rect class="band" x="20" y="92" width="1210" height="150" rx="10"/>
  <text class="band-label" x="36" y="112">MAIN FLOW</text>

  <rect class="lead" x="40" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="56" y="156">1. Brief</text>
  <text class="box-text" x="56" y="178">goal, scope,</text>
  <text class="box-text" x="56" y="195">acceptance command,</text>
  <text class="box-text" x="56" y="212">starting tier</text>

  <rect class="exec" x="240" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="256" y="156">2. Execute</text>
  <text class="box-text" x="256" y="178">Cursor cloud agent</text>
  <text class="box-text" x="256" y="195">opens a draft PR</text>
  <text class="box-text" x="256" y="212">at the chosen tier</text>

  <rect class="gate" x="440" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="456" y="156">3. CI gate</text>
  <text class="box-text" x="456" y="178">tests, typecheck,</text>
  <text class="box-text" x="456" y="195">lint, build</text>
  <text class="box-text" x="456" y="212">must be green</text>

  <rect class="review" x="640" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="656" y="156">4. Review</text>
  <text class="box-text" x="656" y="178">read-only agent,</text>
  <text class="box-text" x="656" y="195">fresh context,</text>
  <text class="box-text" x="656" y="212">level set by risk</text>

  <rect class="lead" x="840" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="856" y="156">5. Summary</text>
  <text class="box-text" x="856" y="178">short, non-technical:</text>
  <text class="box-text" x="856" y="195">what changed and</text>
  <text class="box-text" x="856" y="212">what is risky</text>

  <rect class="human" x="1040" y="130" width="170" height="92" rx="10"/>
  <text class="box-title" x="1056" y="156">6. Human OK</text>
  <text class="box-text" x="1056" y="178">explicit approval for</text>
  <text class="box-text" x="1056" y="195">merge, SemVer tag,</text>
  <text class="box-text" x="1056" y="212">release (built in CI)</text>

  <path class="edge" d="M210,176 L238,176" marker-end="url(#arrow)"/>
  <path class="edge" d="M410,176 L438,176" marker-end="url(#arrow)"/>
  <path class="edge" d="M610,176 L638,176" marker-end="url(#arrow)"/>
  <path class="edge" d="M810,176 L838,176" marker-end="url(#arrow)"/>
  <path class="edge" d="M1010,176 L1038,176" marker-end="url(#arrow)"/>

  <!-- feedback loops -->
  <path class="edge-red" d="M525,222 C525,262 325,262 325,224" marker-end="url(#arrow-red)"/>
  <text class="edge-label-red" x="362" y="270">red CI: back to executor</text>
  <path class="edge-red" d="M725,130 C725,100 325,100 325,128" marker-end="url(#arrow-red)"/>
  <text class="edge-label-red" x="440" y="104">changes requested (max 2 fix rounds)</text>

  <!-- Cascade routing -->
  <rect class="band" x="20" y="300" width="760" height="250" rx="10"/>
  <text class="band-label" x="36" y="320">CASCADE ROUTING (step 2)</text>
  <path class="edge-dashed" d="M325,272 L325,298"/>

  <rect class="t1" x="40" y="340" width="220" height="130" rx="10"/>
  <text class="box-title" x="56" y="366">Tier 1</text>
  <text class="mono" x="56" y="388">composer-2.5</text>
  <text class="box-text" x="56" y="412">mechanical, up to 3 files,</text>
  <text class="box-text" x="56" y="429">clear spec, executable</text>
  <text class="box-text" x="56" y="446">acceptance test</text>

  <rect class="t2" x="290" y="340" width="220" height="130" rx="10"/>
  <text class="box-title" x="306" y="366">Tier 2</text>
  <text class="mono" x="306" y="388">grok-4.7</text>
  <text class="box-text" x="306" y="412">reasoning medium, then high;</text>
  <text class="box-text" x="306" y="429">coupled files, unknown-cause</text>
  <text class="box-text" x="306" y="446">bugs, shared contracts</text>

  <rect class="t3" x="540" y="340" width="220" height="130" rx="10"/>
  <text class="box-title" x="556" y="366">Tier 3 (only if needed)</text>
  <text class="mono" x="556" y="388">claude-sonnet-5-5</text>
  <text class="mono" x="556" y="406">claude-opus-5-5</text>
  <text class="box-text" x="556" y="429">architecture, conflicts,</text>
  <text class="box-text" x="556" y="446">last-resort failures</text>

  <path class="edge-red" d="M260,405 L288,405" marker-end="url(#arrow-red)"/>
  <path class="edge-red" d="M510,405 L538,405" marker-end="url(#arrow-red)"/>
  <text class="edge-label-red" x="40" y="498">Escalate after 2 failed attempts per tier, on the same PR,</text>
  <text class="edge-label-red" x="40" y="515">passing the real CI log or review findings, not a paraphrase.</text>
  <text class="edge-label" x="40" y="536">Cursor-native models first, frontier models last. Model ids change: check what your account offers.</text>

  <!-- Risk-based review -->
  <rect class="band" x="810" y="300" width="420" height="250" rx="10"/>
  <text class="band-label" x="826" y="320">RISK-BASED REVIEW (step 4)</text>
  <path class="edge-dashed" d="M770,222 C770,270 1020,260 1020,298"/>

  <rect class="plain" x="830" y="340" width="380" height="54" rx="8"/>
  <text class="box-title" x="846" y="363">Trivial + green CI</text>
  <text class="box-text" x="846" y="382">docs, typos, config bumps: no review</text>

  <rect class="review" x="830" y="406" width="380" height="54" rx="8"/>
  <text class="box-title" x="846" y="429">Normal</text>
  <text class="box-text" x="846" y="448">1 review round</text>

  <rect class="human" x="830" y="472" width="380" height="62" rx="8"/>
  <text class="box-title" x="846" y="495">Security-sensitive</text>
  <text class="box-text" x="846" y="514">crypto, keys, auth, payments: 2 rounds,</text>
  <text class="box-text" x="846" y="530">reviewer from a different model family</text>

  <!-- Best of N -->
  <rect class="band" x="20" y="580" width="1210" height="170" rx="10"/>
  <text class="band-label" x="36" y="600">BEST-OF-N (on request, hard sub-tasks with objective tests)</text>

  <rect class="t1" x="40" y="620" width="220" height="50" rx="8"/>
  <text class="box-title" x="56" y="643">Agent A</text>
  <text class="mono" x="130" y="643">composer-2.5</text>
  <text class="box-text" x="56" y="661">branch A</text>

  <rect class="t1" x="40" y="684" width="220" height="50" rx="8"/>
  <text class="box-title" x="56" y="707">Agent B</text>
  <text class="mono" x="130" y="707">composer-2.5</text>
  <text class="box-text" x="56" y="725">branch B</text>

  <rect class="gate" x="330" y="640" width="200" height="74" rx="10"/>
  <text class="box-title" x="346" y="666">CI gate</text>
  <text class="box-text" x="346" y="688">same acceptance</text>
  <text class="box-text" x="346" y="704">commands for both</text>

  <rect class="plain" x="600" y="640" width="300" height="74" rx="10"/>
  <text class="box-title" x="616" y="666">First green PR wins</text>
  <text class="box-text" x="616" y="688">close the other one;</text>
  <text class="box-text" x="616" y="704">no LLM judge needed</text>

  <path class="edge" d="M260,645 C295,645 295,670 328,670" marker-end="url(#arrow)"/>
  <path class="edge" d="M260,709 C295,709 295,686 328,686" marker-end="url(#arrow)"/>
  <path class="edge" d="M530,677 L598,677" marker-end="url(#arrow)"/>
  <text class="edge-label" x="930" y="672">then continues at step 4</text>
  <path class="edge-dashed" d="M900,677 L925,677"/>
</svg>
